syntax = "proto3";

package wanderlust.booking.v1;

service BookingService {
  rpc CreateBooking(CreateBookingRequest) returns (BookingResponse);
  rpc CancelBooking(CancelBookingRequest) returns (BookingResponse);
  rpc GetBooking(GetBookingRequest) returns (BookingResponse);
  rpc GetGuestBookings(GetGuestBookingsRequest) returns (BookingsResponse);
  rpc GetOwnerBookings(GetOwnerBookingsRequest) returns (BookingsResponse);
  rpc GetBookedDates(GetBookedDatesRequest) returns (GetBookedDatesResponse);
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
  rpc MarkOwnerSeen(MarkOwnerSeenRequest) returns (BookingResponse);
}

message Booking {
  string id = 1;
  string listing_id = 2;
  string guest_id = 3;
  string owner_id = 4;
  string guest_name_snapshot = 5;
  string guest_email_snapshot = 6;
  string listing_title_snapshot = 7;
  int32 nightly_price_snapshot = 8;
  string check_in = 9;
  string check_out = 10;
  int32 nights = 11;
  int32 subtotal_price = 12;
  int32 tax_amount = 13;
  int32 total_price = 14;
  string status = 15;
  bool owner_seen = 16;
  string created_at = 17;
  string updated_at = 18;
}

message CreateBookingRequest {
  string listing_id = 1;
  string guest_id = 2;
  string guest_name = 3;
  string guest_email = 4;
  string check_in = 5;
  string check_out = 6;
}

message CancelBookingRequest {
  string booking_id = 1;
  string requester_id = 2;
}

message GetBookingRequest {
  string booking_id = 1;
  string requester_id = 2;
}

message GetGuestBookingsRequest {
  string guest_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetOwnerBookingsRequest {
  string owner_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetBookedDatesRequest {
  string listing_id = 1;
}

message CheckAvailabilityRequest {
  string listing_id = 1;
  string check_in = 2;
  string check_out = 3;
}

message MarkOwnerSeenRequest {
  string booking_id = 1;
  string owner_id = 2;
}

message CheckAvailabilityResponse {
  bool available = 1;
  string reason = 2;
}

message GetBookedDatesResponse {
  repeated string booked_dates = 1;
}

message BookingResponse {
  Booking booking = 1;
}

message BookingsResponse {
  repeated Booking bookings = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_count = 4;
}

syntax = "proto3";

package wanderlust.review.v1;

service ReviewService {
  rpc CreateReview(CreateReviewRequest) returns (ReviewResponse);
  rpc DeleteReview(DeleteReviewRequest) returns (DeleteReviewResponse);
  rpc GetListingReviews(GetListingReviewsRequest) returns (GetListingReviewsResponse);
  rpc GetReviewSummary(GetReviewSummaryRequest) returns (GetReviewSummaryResponse);
}

message Review {
  string id = 1;
  string listing_id = 2;
  string author_id = 3;
  string author_name_snapshot = 4;
  int32 rating = 5;
  string comment = 6;
  string created_at = 7;
  string updated_at = 8;
}

message CreateReviewRequest {
  string listing_id = 1;
  string author_id = 2;
  string author_name = 3;
  int32 rating = 4;
  string comment = 5;
}

message DeleteReviewRequest {
  string review_id = 1;
  string listing_id = 2;
  string requester_id = 3;
}

message DeleteReviewResponse {
  bool deleted = 1;
  string review_id = 2;
}

message GetListingReviewsRequest {
  string listing_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetListingReviewsResponse {
  repeated Review reviews = 1;
  int32 page = 2;
  int32 page_size = 3;
  int32 total_count = 4;
}

message GetReviewSummaryRequest {
  string listing_id = 1;
}

message GetReviewSummaryResponse {
  string listing_id = 1;
  double average_rating = 2;
  int32 review_count = 3;
}

message ReviewResponse {
  Review review = 1;
}

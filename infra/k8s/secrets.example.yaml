# Copy this file to secrets.yaml, replace every placeholder, and apply it manually:
# kubectl apply -f infra/k8s/secrets.yaml
#
# Do not commit secrets.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: airbnb-secrets
  namespace: airbnb-replica
type: Opaque
stringData:
  JWT_SECRET: "change-me"
  SCRETE: "change-me"
  CLOUD_NAME: "your-cloudinary-cloud-name"
  CLOUD_API_KEY: "your-cloudinary-api-key"
  CLOUD_API_SCRETE: "your-cloudinary-api-secret"
  MAP_TOKEN: "your-mapbox-token"
  AUTH_DB_URL: "mongodb+srv://USER:PASS@cluster.mongodb.net/auth-db?retryWrites=true&w=majority&appName=Cluster0"
  LISTING_DB_URL: "mongodb+srv://USER:PASS@cluster.mongodb.net/listing-db?retryWrites=true&w=majority&appName=Cluster0"
  BOOKING_DB_URL: "mongodb+srv://USER:PASS@cluster.mongodb.net/booking-db?retryWrites=true&w=majority&appName=Cluster0"
  REVIEW_DB_URL: "mongodb+srv://USER:PASS@cluster.mongodb.net/review-db?retryWrites=true&w=majority&appName=Cluster0"
  NOTIFICATION_DB_URL: "mongodb+srv://USER:PASS@cluster.mongodb.net/notification-db?retryWrites=true&w=majority&appName=Cluster0"

apiVersion: v1
kind: Service
metadata:
  name: gateway
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
spec:
  type: LoadBalancer
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: listing-service
spec:
  type: ClusterIP
  selector:
    app: listing-service
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  type: ClusterIP
  selector:
    app: booking-service
  ports:
    - name: grpc
      port: 50053
      targetPort: 50053
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
spec:
  type: ClusterIP
  selector:
    app: review-service
  ports:
    - name: grpc
      port: 50054
      targetPort: 50054
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: grpc
      port: 50055
      targetPort: 50055

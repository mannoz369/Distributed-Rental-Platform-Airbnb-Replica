name: Build Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gateway
            dockerfile: Dockerfile
            image: airbnb-replica-gateway
          - name: auth-service
            dockerfile: services/auth-service/Dockerfile
            image: airbnb-replica-auth-service
          - name: listing-service
            dockerfile: services/listing-service/Dockerfile
            image: airbnb-replica-listing-service
          - name: booking-service
            dockerfile: services/booking-service/Dockerfile
            image: airbnb-replica-booking-service
          - name: review-service
            dockerfile: services/review-service/Dockerfile
            image: airbnb-replica-review-service
          - name: notification-service
            dockerfile: services/notification-service/Dockerfile
            image: airbnb-replica-notification-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ github.sha }}
